name: Component Security Validation

on:
  pull_request:
    paths:
      - 'cli-tool/components/**/*.md'
      - 'cli-tool/src/validation/**'
      - '.github/workflows/component-security-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'cli-tool/components/**/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history so the base..head diff works

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: cli-tool/package-lock.json

      - name: Install dependencies
        run: |
          cd cli-tool
          npm ci --ignore-scripts

      # CCT-06: gate a PR only on the component files it actually changes, so the
      # audit is BLOCKING for new/modified components without being tripped by
      # pre-existing findings in unchanged catalog files. `git diff` lists the
      # changed component markdown files against the PR base (or the push range).
      - name: Determine changed component files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            RANGE="$BASE...HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR $RANGE -- 'cli-tool/components/**/*.md' | paste -sd, -)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "No changed component files."
          else
            echo "Changed component files:"; echo "$FILES" | tr ',' '\n'
          fi

      - name: Run Security Audit (changed components)
        id: audit
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        run: |
          node cli-tool/src/security-audit.js --ci --json \
            --output=cli-tool/security-report.json \
            --files="${{ steps.changed.outputs.files }}"

      - name: Upload Security Report
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-report
          path: cli-tool/security-report.json
          retention-days: 30

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always() && steps.changed.outputs.files != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- component-security-audit:v1 -->';
            const reportPath = 'cli-tool/security-report.json';

            if (!fs.existsSync(reportPath)) {
              console.log('No security report found');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const { passed, failed, warnings, total } = report.summary;

            const status = failed === 0 ? '✅ PASSED' : '❌ FAILED';
            const emoji = failed === 0 ? '🎉' : '⚠️';

            let comment = `${marker}\n## ${emoji} Component Security Audit\n\n`;
            comment += `Scanned the **${total} component file(s) changed in this PR**. `;
            comment += `This check **blocks merge** when a changed component fails.\n\n`;
            comment += `**Status**: ${status}\n\n`;
            comment += `| Metric | Count |\n|--------|-------|\n`;
            comment += `| Changed components | ${total} |\n`;
            comment += `| ✅ Passed | ${passed} |\n`;
            comment += `| ❌ Failed | ${failed} |\n`;
            comment += `| ⚠️ Warnings | ${warnings} |\n\n`;

            if (failed > 0) {
              comment += `### ❌ Failed components\n\n`;
              comment += `| Component | Errors | Warnings | Score |\n`;
              comment += `|-----------|--------|----------|-------|\n`;
              for (const c of report.components.filter(c => !c.overall.valid)) {
                const name = c.component.path;
                comment += `| \`${name}\` | ${c.overall.errorCount} | ${c.overall.warningCount} | ${c.overall.score}/100 |\n`;
              }
              comment += `\n_Fix the errors above, or if a finding is a false positive, flag it for a maintainer._\n`;
            }

            comment += `\n---\n📊 **[Full report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})**`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const prev = existing.find(c => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body: comment });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
            }

      - name: Enforce gate
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::A component changed in this PR failed the security audit. See the PR comment / report artifact."
          exit 1
